eksperimen:
  EXP-01:
    judul: "Durasi total"
    status: antre
    lengan: {A: {durasi.target_detik: 20}, B: {durasi.target_detik: 15}, C: {durasi.target_detik: 28}}
    metrik_utama: komisi_per_1000_views
    metrik_diagnosis: [avg_watch_pct, completion, ctr_link]
    pengaman: [hold_3s]
    unit: video
    sampel_min_per_lengan: 40
    durasi_min_hari: 21
    catatan: "Durasi mengubah avg_watch_pct secara mekanis (video pendek selalu menang persentase), jadi metrik utamanya klik/komisi, bukan watch %."
  EXP-02:
    judul: "Tipe hook"
    status: antre
    lengan:
