# Registry parameter video affiliate
#
# Semua angka spesifikasi video tinggal di sini, bukan di kode. Penjelasan lengkap, metrik, dan aturan
# eksperimen ada di docs/12-optimization-and-experiments.md (selanjutnya "doc 12").
#
# Bentuk satu parameter:
#   <nama.bertitik>:
#     status:     default | eksperimen | usulan
#                   default    = dipakai di MVP apa adanya                        → [Default] di doc 12
#                   eksperimen = MVP memakai `nilai` sebagai kontrol; lengan lain diuji A/B  → [Eksperimen]
#                   usulan     = belum dipakai sampai pemilik menyetujui            → [Usulan]
#     nilai:      nilai MVP (untuk usulan: nilai yang diusulkan)
#     rentang:    [min, max] untuk angka; atau
#     pilihan:    daftar nilai yang sah (untuk daftar: setiap elemen harus ada di pilihan)
#     satuan:     opsional
#     kunci:      opsional; compliance | qa. Parameter berkunci tidak boleh disentuh eksperimen atau bandit,
#                 dan mengubah nilainya butuh ADR (doc 12 §2.3).
#     alasan:     kenapa angka ini
#     sumber:     id dari bagian `sumber` atau `hipotesis` di bawah
#     eksperimen: opsional; id di bagian `eksperimen`
#
# Cek konsistensi: python3 tools/cek_params.py
# Snapshot + variant_id: python3 tools/cek_params.py snapshot [--set nama=nilai ...] [--eksperimen EXP-xx --lengan B]

versi_skema: 1

sumber:
  BT-BIBLE: "baru-tau-autopilot series/BIBLE.md — tempo narasi, caption, gerak dalam angka, TERLARANG"
  BT-BASELINE: "baru-tau-autopilot series/BASELINE.md — batas bawah kualitas yang terukur (frame 0, caption ≥ 64 px, diam ≤ 0,5 s, kontras 4,5:1)"
  BT-VIRAL: "baru-tau-autopilot series/VIRAL.md — hook, ritme visual 2–4 s, jam posting (data Buffer 2,5 juta post), kuota"
  BT-AUDIT: "baru-tau-autopilot docs/AUDIT-2026-10-19.md dan docs/audit/audio.md — temuan terukur #001"
  BT-SLATE: "slate-studio slate_sound.py, app.py, qa.py — ducking 7 dB, musik -6/-12 dB, -14 LUFS, TP <= -1,5 dBTP, jeda 0,38/0,7 s, stability 0,5"
  R-TIKTOK-ORI: "Ringkasan pihak ketiga aturan 'unoriginal content' TikTok (bigseller.pro, openclip.app, 2025–2026). Tidak resmi; wajib dicek ke Community Guidelines"
  R-TIKTOK-SHOP: "TikTok Shop Content Policy 22 Mei 2026 dan Branded Content Policy 31 Agustus 2026 (disebut di ppc.land/canopymanagement.com; teks resmi belum dibaca)"
  R-SHOPEE-AFF: "shopee.co.id/inspirasi-shopee/shopee-affiliates-program — akun pribadi, konten orisinal, produk terlarang"
  R-SHORTS-BENCH: "Panduan pihak ketiga Shorts (subscribr.ai, contentstudio.io, socialmediaexaminer.com): tidak ada ambang resmi; bandingkan dengan video sendiri"
  R-ELEVEN: "ElevenLabs docs 'Prompting Eleven v3': stability = preset Creative/Natural/Robust; v2 punya stability/similarity/style/speed kontinu"
  TEKNIS: "Alasan teknis render/encode (dijelaskan di doc 12 §5)"
  R-SHOPEE-VIDEO: "Pusat Bantuan Shopee (label AI wajib untuk narasi AI, klaim harga, pelanggaran, tag produk, keranjang kiri bawah); doc 14"
  R-PLAYHEAD: "Playhead, 19 video viral TikTok Shop (Mei–Sep 2026): produk terlihat median 0,07 s, bukti median 2,73 s, tanpa wajah median 13,5 s (tryplayhead.com/blog/tiktok-shop-hooks; doc 13 §4)"
  VM-PLATFORMS: "/data/apps/video-maker/config/platforms.json: zona aman px per platform (belum diverifikasi ke platform; doc 13 §5)"
  PEMILIK-MUSIK: "Catatan pemilik di konsol 20 Okt 2026 17:10 (Ulangi aff002-kipas): 'musik backsound nya hilang muncul hilang muncul jadi kurang enak ditonton'. Ukuran score.json keempat video pertama: rentang level musik p10-p90 27-105 dB, 10-21 jendela 0,5 s tanpa musik di luar hening (level per bagian x0,1-2,3 demi LRA + not musik dihapus di sekitar hentakan)"
  DATA-2026-10-19: "Paket data pemilik affiliate_pipeline_data_2026-10-19.zip (9 produk shortlist); temuan di docs/TODO.md §3"

hipotesis:
  H01: "Video produk lebih pendek dari explainer: unit informasinya lebih sedikit (produk, 2–3 manfaat, bukti, CTA), jadi 18–25 s memberi completion lebih tinggi tanpa memotong CTA."
  H02: "Produk terlihat di frame 0 menaikkan klik dari penonton yang bertahan, tapi bisa menaikkan swipe karena terbaca sebagai iklan."
  H03: "Hook pertanyaan (pola terkuat Baru Tau) sama baiknya atau lebih baik daripada pain/klaim angka untuk produk murah, dan paling aman secara compliance."
  H04: "Tempo jualan sedikit lebih cepat dari explainer (2,6 vs 2,4–2,6 kata/s) tanpa terdengar terburu-buru, asalkan CTA tetap paling lambat."
  H05: "Caption per frasa dengan 1 kata kunci disorot lebih terbaca di HP daripada word-by-word, yang menarik mata dari produk."
  H06: "Harga sebagai angka bertanggal menaikkan CTR untuk produk < Rp100rb dan tidak berpengaruh/menurunkan untuk produk mahal."
  H07: "Musik pelan di bawah VO menaikkan avg watch % dibanding tanpa musik; volume di atas -6 dB relatif menurunkan pemahaman."
  H08: "Untuk belanja, jam malam (19–21 WIB) mengalahkan pagi di TikTok/Reels; Threads tetap pagi (data Baru Tau/Buffer)."
  H09: "Dua varian per produk cukup untuk belajar; varian ketiga lebih sering menurunkan jangkauan akun (dibaca sebagai duplikat) daripada menambah informasi."
  H10: "Foto persegi di kartu di atas latar warna lebih terbaca daripada crop penuh 9:16, yang memotong produk."
  H11: "Ken Burns pelan di 30 fps tidak terlihat patah-patah; di 24 fps pan lambat terlihat 'judder'."
  H12: "Label disclosure kecil yang persisten tidak menaikkan swipe secara terukur dibanding label di akhir saja."

# Definisi lengkap dan sumber datanya: doc 12 §4.2
metrik:
  views_72j: "views 72 jam setelah tayang (distribusi)"
  hold_3s: "fraksi penonton yang masih menonton di detik 3 (Shorts: 'viewed' vs 'swiped away'; TikTok: kurva retensi)"
  avg_watch_pct: "rata-rata persen durasi yang ditonton"
  completion: "fraksi penonton yang menonton sampai habis"
  ctr_link: "klik link affiliate (sub_id video) per 1.000 views"
  cvr_order: "order per klik"
  komisi_per_1000_views: "komisi (tertunda + tervalidasi) per 1.000 views"
  komisi_bersih_per_video: "komisi tervalidasi − biaya langsung video (TTS, LLM, compute)"
  laporan_negatif: "not interested / laporan / komentar negatif per 1.000 views"
  keluhan_harga: "komentar atau pesan yang menyebut harga di video tidak sama dengan di toko"
  cancel_retur: "fraksi order yang batal/retur"

parameter:

  # ---------------------------------------------------------------- durasi dan beat
  durasi.target_detik:
    status: eksperimen
    nilai: 20
    rentang: [12, 45]
    satuan: detik
    alasan: "Video TikTok Shop viral tanpa wajah median 13,5 s (Playhead, 19 video); Shopee Video 12–20 s; Baru Tau 35–45 s untuk explainer. 20 s = 6 bagian × ~3,3 s (doc 13 §4, BIBLE affiliate)."
    sumber: [BT-BIBLE, R-PLAYHEAD, H01]
    eksperimen: EXP-01
  durasi.ekor_loop_detik:
    status: default
    nilai: 0.3
    rentang: [0.0, 0.6]
    satuan: detik
    alasan: "Film = durasi VO + ekor supaya frame akhir sempat menyambung ke frame 0 (Baru Tau META.dur = VO + 0,3; audit menemukan ekor terpotong saat durasi = VO)."
    sumber: [BT-AUDIT, BT-BASELINE]
  beat.durasi_min_detik:
    status: default
    nilai: 1.5
    rentang: [1.0, 3.0]
    satuan: detik
    alasan: "Di bawah 1,5 s satu foto produk belum terbaca (0,3 s per kata teks kunci + waktu mengenali benda)."
    sumber: [BT-BIBLE]
  beat.durasi_maks_detik:
    status: default
    nilai: 4.0
    rentang: [3.0, 6.0]
    satuan: detik
    alasan: "Pergantian visual setiap 2–4 s (Baru Tau VIRAL). Ken Burns di satu foto lebih dari 4 s terasa diam walau bergerak."
    sumber: [BT-VIRAL]
  beat.hook_maks_detik:
    status: default
    nilai: 3.0
    rentang: [1.5, 6.0]
    satuan: detik
    alasan: "Baru Tau: hook selesai ≤ 15% durasi. 15% dari 22 s = 3,3 s."
    sumber: [BT-BASELINE]
  template.default:
    status: eksperimen
    nilai: masalah_solusi
    pilihan: [masalah_solusi, fitur_cepat, price_reveal]
    alasan: "Satu template di MVP supaya hasil awal bisa dibandingkan. Pilih otomatis per kategori adalah usulan (template.pilih_per_kategori); perbandingan menunggu ADR-P03."
    sumber: [H03]
    eksperimen: EXP-03
  template.pilih_per_kategori:
    status: usulan
    nilai: false
    pilihan: [true, false]
    alasan: "Baru aktif setelah EXP-03 punya pemenang per kategori; sebelum itu pemetaan kategori→template hanya tebakan."
    sumber: [H01]
  template.masalah_solusi.urutan:
    status: default
    nilai: [hook, masalah, produk, fitur, fitur, bukti, harga, cta]
    pilihan: [hook, masalah, produk, fitur, bukti, harga, cta]
    alasan: "Struktur Baru Tau (hook → dunia dikenal → kejanggalan → temuan → ajakan) dipetakan ke jualan: masalah yang dikenal → produk sebagai jawaban → bukti dari feed. Beat harga dibuang otomatis kalau harga.mode = tanpa_angka."
    sumber: [BT-BIBLE]
    eksperimen: EXP-03
  template.fitur_cepat.urutan:
    status: eksperimen
    nilai: [hook, produk, fitur, fitur, fitur, bukti, harga, cta]
    pilihan: [hook, masalah, produk, fitur, bukti, harga, cta]
    alasan: "Untuk produk yang manfaatnya terlihat dari foto (gadget kecil, alat dapur). Lengan B di EXP-03."
    sumber: [H01]
    eksperimen: EXP-03
  template.price_reveal.urutan:
    status: eksperimen
    nilai: [hook, produk, fitur, fitur, bukti, harga, cta]
    pilihan: [hook, masalah, produk, fitur, bukti, harga, cta]
    alasan: "Hook 'tebak harganya' lalu harga dibuka di akhir. Hanya sah kalau harga.mode = angka_bertanggal; kalau tidak, template ini tidak boleh dipilih."
    sumber: [H06]
    eksperimen: EXP-03
  template.perbandingan.urutan:
    status: usulan
    nilai: [hook, produk, produk, fitur, bukti, cta]
    pilihan: [hook, masalah, produk, fitur, bukti, harga, cta]
    alasan: "2 produk dari kategori yang sama, angka hanya dari feed. Butuh dukungan multi-produk di kontrak feed dan link (lihat ADR-P03)."
    sumber: [H01]

  # ---------------------------------------------------------------- voiceover (ElevenLabs)
  vo.tempo_kata_per_detik:
    status: eksperimen
    nilai: 2.6
    rentang: [2.2, 3.0]
    satuan: kata terucap per detik (rata-rata, setelah jeda)
    alasan: "Baru Tau 145–155 kpm efektif = 2,4–2,6 kata/s. Jualan boleh di ujung atas. Di atas 3,0 penonton HP mulai kehilangan kata (audit: CTA 261 kpm terdengar terburu-buru)."
    sumber: [BT-BIBLE, BT-AUDIT, H04]
    eksperimen: EXP-06
  vo.tempo_maks_kalimat_kps:
    status: default
    kunci: qa
    nilai: 3.15
    rentang: [2.8, 3.3]
    satuan: kata per detik, per kalimat
    alasan: "Batas Baru Tau 190 kpm per kalimat (3,17 kata/s). Kalimat yang lewat ditulis ulang, bukan dipercepat."
    sumber: [BT-BIBLE]
  vo.kata_target:
    status: default
    nilai: 48
    rentang: [30, 90]
    satuan: kata terucap (angka ditulis dengan huruf)
    alasan: "≈ (durasi − ekor − total jeda) × tempo = (22 − 0,3 − 2,8) × 2,6 ≈ 49. Dihitung ulang kalau durasi atau tempo berubah (doc 12 §3.2)."
    sumber: [BT-BIBLE]
  vo.kata_maks_per_kalimat:
    status: default
    nilai: 12
    rentang: [8, 14]
    alasan: "Baru Tau ≤ 14. Lebih pendek untuk jualan karena satu kalimat = satu caption ≤ 5 kata ×2–3 layar."
    sumber: [BT-BIBLE, BT-AUDIT]
  vo.model:
    status: default
    nilai: eleven_v3
    pilihan: [eleven_v3, eleven_multilingual_v2]
    alasan: "Model yang sudah dipakai Slate Studio. v3 lebih ekspresif dan mendukung audio tag; v2 punya kontrol speed."
    sumber: [BT-SLATE, R-ELEVEN]
  vo.voice_id:
    status: eksperimen
    nilai: kandidat_a
    pilihan: [kandidat_a, kandidat_b, kandidat_c]
    alasan: "Audit Baru Tau: kesan 'AI' ada di ritme dan energi; suara native Indonesia layak diuji A/B. Tiga kandidat dari Voice Library (filter Indonesian) diisi pemilik; ID asli di .env/registry suara, bukan di sini."
    sumber: [BT-AUDIT]
    eksperimen: EXP-04
  vo.stability:
    status: default
    nilai: 0.5
    pilihan: [0.0, 0.5, 1.0]
    alasan: "Untuk v3 stability adalah preset (Creative/Natural/Robust); Slate mengirim 0,5 (Natural). Creative rawan halusinasi pengucapan angka dan nama produk."
    sumber: [BT-SLATE, R-ELEVEN]
  vo.v2.similarity_boost:
    status: default
    nilai: 0.75
    rentang: [0.5, 0.9]
    alasan: "Nilai Slate untuk v2. Hanya dipakai kalau vo.model = eleven_multilingual_v2."
    sumber: [BT-SLATE]
  vo.v2.style:
    status: default
    nilai: 0.1
    rentang: [0.0, 0.4]
    alasan: "Nilai Slate untuk v2. Di atas 0,4 suara mulai tidak stabil antar-take."
    sumber: [BT-SLATE, R-ELEVEN]
  vo.v2.speed:
    status: default
    nilai: 1.0
    rentang: [0.9, 1.15]
    alasan: "API menerima 0,7–1,2; di luar 0,9–1,15 artefak terdengar. Tempo diatur lewat naskah, bukan speed."
    sumber: [BT-SLATE]
  vo.jeda_kalimat_detik:
    status: default
    nilai: 0.30
    rentang: [0.20, 0.50]
    satuan: detik
    alasan: "Baru Tau memakai 0,38 untuk explainer. Jualan sedikit lebih rapat. Jeda seragam 0,12–0,25 s adalah tanda suara AI (analisis #001), jadi jangan di bawah 0,20."
    sumber: [BT-SLATE, BT-AUDIT, H04]
  vo.jeda_bagian_detik:
    status: default
    nilai: 0.7
    rentang: [0.3, 0.8]
    satuan: detik
    alasan: "Baru Tau 0,7 di pergantian bagian. aff001 (0,5) dan aff002 (0,5) berakhir dengan LRA 1,5 dan 2,2 LU (< 2,5, mix datar) karena 19 s narasi hampir tanpa celah; kedua kreator menyimpulkan 0,7. Durasi naik ±1,2 s untuk 6 pergantian."
    sumber: [BT-SLATE, BT-AUDIT]
  vo.jeda_sebelum_payoff_detik:
    status: default
    nilai: 0.45
    rentang: [0.0, 0.8]
    satuan: detik
    alasan: "Satu jeda dramatis sebelum produk muncul (atau sebelum harga di price_reveal). Baru Tau: jeda 0,4–0,8 s sebelum jawaban; hening ≥ 0,4 s harus di dalam jeda VO."
    sumber: [BT-BIBLE, BT-AUDIT]
  vo.audio_tag_maks:
    status: default
    nilai: 1
    rentang: [0, 2]
    alasan: "Baru Tau ≤ 2 untuk 90 kata; naskah jualan separuhnya."
    sumber: [BT-BIBLE]
  vo.cta_paling_lambat:
    status: default
    nilai: true
    pilihan: [true, false]
    alasan: "Audit #001: CTA adalah kalimat tercepat (261 kpm). Aturan: CTA dibaca paling lambat."
    sumber: [BT-AUDIT, BT-BIBLE]

  # ---------------------------------------------------------------- hook
  hook.tipe:
    status: eksperimen
    nilai: pertanyaan
    pilihan: [pertanyaan, klaim_angka, pain, visual_shock, price_reveal]
    alasan: "Pertanyaan = pola Baru Tau yang terbukti dan paling aman compliance. klaim_angka hanya angka feed (terjual, rating, diskon). pain dilarang untuk kategori yang klaim manfaatnya diatur (kesehatan, kosmetik, suplemen). price_reveal hanya kalau harga.mode = angka_bertanggal."
    sumber: [BT-VIRAL, H03]
    eksperimen: EXP-02
  hook.durasi_detik:
    status: default
    nilai: 2.5
    rentang: [1.5, 4.0]
    satuan: detik
    alasan: "Kata kunci hook terucap sebelum 1,5 s, lalu satu beat kecil untuk mendaratkan. Batas atas mengikuti beat.hook_maks_detik."
    sumber: [BT-BASELINE]
  hook.produk_di_frame0:
    status: eksperimen
    nilai: true
    pilihan: [true, false]
    alasan: "Baru Tau: frame 0 = thumbnail utuh dengan subjek terlihat. Untuk jualan subjek = produk, tapi produk di frame 0 bisa terbaca sebagai iklan. Lengan B: masalah/konteks di frame 0, produk masuk ≤ 1,5 s."
    sumber: [BT-BASELINE, H02]
    eksperimen: EXP-05
  hook.teks_layar_kata_maks:
    status: default
    nilai: 5
    rentang: [3, 7]
    alasan: "Baru Tau: ≤ 5 kata, memuat nama benda atau kejanggalannya, terbaca 1 s tanpa suara. Juga dibaca pencarian TikTok/Shorts."
    sumber: [BT-BASELINE, BT-VIRAL]
  hook.kata_kunci_sebelum_detik:
    status: default
    nilai: 1.5
    rentang: [1.0, 2.5]
    satuan: detik
    alasan: "Baru Tau menargetkan < 2 s; #001 terlambat (2,88 s). Video jualan lebih cepat diswipe, jadi 1,5."
    sumber: [BT-BIBLE, BT-AUDIT]
  hook.aksi_pertama_dalam_detik:
    status: default
    kunci: qa
    nilai: 0.5
    rentang: [0.2, 0.5]
    satuan: detik
    alasan: "Baru Tau BASELINE 2: ada aksi pertama dalam 0,5 s. Frame 0 yang diam terbaca sebagai video macet."
    sumber: [BT-BASELINE]
  hook.kandidat_dibuat:
    status: default
    nilai: 3
    rentang: [1, 8]
    alasan: "Satu panggilan LLM menulis 3 hook; dipilih dengan aturan (≤ 5 kata, nama produk, tidak ada klaim di luar feed). Generator + penilai otomatis yang lebih besar ada di ide B2."
    sumber: [TEKNIS]

  # ---------------------------------------------------------------- teks di layar
  caption.gaya:
    status: eksperimen
    nilai: per_frasa
    pilihan: [per_frasa, kata_per_kata, kalimat, tanpa]
    alasan: "Baru Tau: caption dipecah dari timing kata, ≤ 7 kata, 1–2 baris, kata kunci disorot. Word-by-word adalah gaya umum jualan; diuji (EXP-07)."
    sumber: [BT-BASELINE, H05]
    eksperimen: EXP-07
  caption.kata_maks_per_layar:
    status: default
    nilai: 5
    rentang: [1, 7]
    alasan: "Baru Tau ≤ 7. Video jualan lebih cepat dan ada teks kunci (harga, bukti) yang bersaing, jadi 5."
    sumber: [BT-BASELINE]
  caption.font_px:
    status: default
    nilai: 68
    rentang: [64, 96]
    satuan: px (kanvas 1080×1920)
    alasan: "Baru Tau ≥ 64 px (caption #001 42 px terlalu kecil di HP). Batas bawah tidak boleh turun."
    sumber: [BT-BASELINE, BT-AUDIT]
  caption.kata_disorot_per_layar:
    status: default
    nilai: 1
    rentang: [0, 3]
    alasan: "Baru Tau 1–3. Untuk jualan satu saja: kata manfaat atau angka feed."
    sumber: [BT-BASELINE]
  caption.warna_sorot:
    status: default
    nilai: "#FFD23F"
    pilihan: ["#FFD23F", "#FF5A36", "#3DDC97"]
    alasan: "Kuning hangat terbaca di atas foto terang dan gelap dengan kotak/outline; kontras tetap dicek per frame (teks.kontras_min)."
    sumber: [BT-BASELINE]
  teks.detik_baca_per_kata:
    status: default
    nilai: 0.3
    rentang: [0.25, 0.4]
    satuan: detik
    alasan: "Standar tipografi Baru Tau. Teks kunci 3 kata tampil ≥ 0,9 s."
    sumber: [BT-BIBLE]
  teks.kunci_font_px:
    status: default
    nilai: 60
    rentang: [56, 120]
    satuan: px
    alasan: "Baru Tau: teks kunci ≥ 56 px (cap-height ≥ 40). Harga dan bukti sosial adalah teks kunci."
    sumber: [BT-BASELINE]
  teks.kontras_min:
    status: default
    kunci: qa
    nilai: 4.5
    rentang: [4.5, 7.0]
    alasan: "WCAG 4,5:1 di setiap frame (Baru Tau BASELINE 13, dicek QA Slate lewat META.kontras). Foto produk terang membuat caption tanpa kotak sering gagal."
    sumber: [BT-BASELINE, BT-SLATE]
  zona_aman.tiktok.bawah_px:
    status: default
    nilai: 320
    rentang: [280, 560]
    satuan: px dari bawah
    alasan: "video-maker platforms.json (TikTok bawah 320). Belum diverifikasi ke UI terbaru, termasuk anchor produk TikTok Shop."
    sumber: [VM-PLATFORMS]
  zona_aman.tiktok.kanan_px:
    status: default
    nilai: 140
    rentang: [100, 180]
    satuan: px dari kanan
    alasan: "video-maker platforms.json (kolom ikon kanan 140)."
    sumber: [VM-PLATFORMS]
  zona_aman.reels.bawah_px:
    status: default
    nilai: 450
    rentang: [320, 520]
    satuan: px dari bawah
    alasan: "video-maker platforms.json (Reels bawah 450). Hanya berlaku kalau video dibuat untuk Reels."
    sumber: [VM-PLATFORMS]
  zona_aman.threads.bawah_px:
    status: default
    nilai: 440
    rentang: [300, 520]
    satuan: px dari bawah
    alasan: "Baru Tau: caption di atas y = 1480 → 440 px dari bawah."
    sumber: [BT-BASELINE]
  zona_aman.shopee_video.bawah_px:
    status: default
